pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SecureDroid-OS"

include(":app")

def capacitorAndroidDir = file("../node_modules/@capacitor/android/capacitor")

if (capacitorAndroidDir.exists()) {
    include(":capacitor-android")
    project(":capacitor-android").projectDir = capacitorAndroidDir
} else {
    throw new GradleException(
        "Capacitor Android module not found at: ${capacitorAndroidDir.absolutePath}"
    )
}
