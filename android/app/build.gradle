plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.securedroid'
    compileSdk 36

    defaultConfig {
        applicationId 'com.securedroid.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    // Explicit dependency for androidx.activity.result.ActivityResult,
    // used by SecureDroidCapacitorPlugin's @ActivityCallback method.
    // activity-ktx alone does not reliably resolve this class on all
    // configurations; without it, the plugin class can fail to verify
    // at load time, causing Capacitor to report the plugin as
    // unimplemented for every method, not just the one that uses it
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.code.gson:gson:2.13.1'

    implementation project(':capacitor-android')
}
